<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Duka POS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b45309'/%3E%3Cpath d='M9 11h14l-1.4 9H10.4z' fill='none' stroke='%23fff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='12.5' cy='23.5' r='1.5' fill='%23fff'/%3E%3Ccircle cx='19.5' cy='23.5' r='1.5' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="preload" href="fonts/roboto-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Pick the theme before first paint so a dark till doesn't flash white.
    try {
      var m = localStorage.getItem('duka_pos.theme_mode') || 'system';
      var dark = m === 'dark' || (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    } catch (e) {}
  </script>
  <style>
    /* Shown instantly, before the scripts have loaded — the same stone/amber as the app. */
    #splash { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; color: #78716c; font: 500 16px Roboto, system-ui, sans-serif; }
    #splash .dot { width: 40px; height: 40px; border-radius: 50%; border: 4px solid #d6d3d1; border-top-color: #b45309; animation: s 0.9s linear infinite; }
    @keyframes s { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app"><div id="splash"><div class="dot"></div>Duka POS</div></div>
  <noscript>Duka POS needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
